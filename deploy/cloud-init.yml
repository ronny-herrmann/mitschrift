#cloud-config
# Beim Anlegen des Hetzner-Servers unter „Cloud config“ einfügen.
# Vorher nur ACCESS_PASSWORD (und ggf. ACME_EMAIL) anpassen.
# Danach dauert die Einrichtung ca. 10 Minuten; die Adressen stehen dann in /root/MITSCHRIFT.txt
# (bzw. Test: https://test.<IP-mit-Bindestrichen>.sslip.io, Produktiv: https://<IP-mit-Bindestrichen>.sslip.io).

write_files:
  - path: /opt/mitschrift/settings.env
    permissions: "0600"
    content: |
      REPO_URL=https://github.com/ronny-herrmann/mitschrift.git
      ACCESS_PASSWORD=HIER-EIN-LANGES-PASSWORT
      ACME_EMAIL=deine@email.de
      # Nur bei privatem Repository: Token mit reinem Lese-Recht auf dieses eine Repository
      GITHUB_TOKEN=
      # Sprachmodell (klein und schnell auf CPU; auf GPU-Server z. B. …Ministral-3-14B-Instruct-2512-GGUF:Q4_K_M)
      LLM_HF_MODEL=mistralai/Ministral-3-3B-Instruct-2512-GGUF:Q4_K_M

runcmd:
  - apt-get update -q && apt-get install -y -q git
  - bash -c 'source /opt/mitschrift/settings.env; U=$REPO_URL; [ -n "$GITHUB_TOKEN" ] && U=${REPO_URL/https:\/\//https:\/\/x-access-token:$GITHUB_TOKEN@}; git clone -q "$U" /opt/mitschrift/prod'
  - bash /opt/mitschrift/prod/deploy/bootstrap.sh > /var/log/mitschrift-setup.log 2>&1
