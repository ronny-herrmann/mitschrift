<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0069FF">
  <title>Anmelden – Protokollant</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; }
    .login { width: min(380px, calc(100vw - 32px)); }
    .login .brand { margin-bottom: 1rem; }
    .login .btn { width: 100%; justify-content: center; margin-top: .75rem; }
    .login .field { display: flex; flex-direction: column; gap: .35rem; font-size: .9rem; font-weight: 500; }
    .login .field input { width: 100%; box-sizing: border-box; padding: .6rem .75rem; font-size: 1rem; }
    .err { color: var(--danger); min-height: 1.4em; margin-top: .5rem; font-size: .9rem; }
  </style>
</head>
<body>
  <form class="card login" id="f">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="#0069FF"/><path fill="#fff" d="M5.5 9h2.6v5.7h4.3V9H15v14h-2.6v-5.9H8.1V23H5.5z"/><rect x="15.9" y="6.5" width="1.2" height="19" rx=".6" fill="#fff" opacity=".85"/><path fill="#fff" d="M18 9h2.5l4.1 8.9V9h2.4v14h-2.5l-4.1-8.9V23H18z"/></svg>
      <span class="brand-text"><span class="brand-name">Protokollant</span><span class="brand-sub">Stadt Heilbronn</span></span>
    </div>
    <label class="field"><span>Zugangspasswort</span><input type="password" id="pw" autocomplete="current-password" autofocus required></label>
    <button class="btn primary" type="submit">Anmelden</button>
    <div class="err" id="err" role="alert"></div>
    <p class="muted">Pilotbetrieb. Nur Testaufnahmen ohne echte personenbezogene Daten verwenden.</p>
  </form>
  <script src="/static/login.js"></script>
</body>
</html>
