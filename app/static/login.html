<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0069FF">
  <title>Anmelden – Mitschrift</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; }
    .login { width: min(380px, calc(100vw - 32px)); }
    .login .brand { margin-bottom: 1rem; }
    .login .btn { width: 100%; justify-content: center; margin-top: .75rem; }
    .login .field { display: flex; flex-direction: column; gap: .35rem; font-size: .9rem; font-weight: 500; }
    .login .field input { width: 100%; box-sizing: border-box; padding: .6rem .75rem; font-size: 1rem; }
    .err { color: var(--danger); min-height: 1.4em; margin-top: .5rem; font-size: .9rem; }
  </style>
</head>
<body>
  <form class="card login" id="f">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="#0069FF"/><rect x="9" y="11" width="3" height="10" rx="1.5" fill="#fff"/><rect x="14.5" y="7" width="3" height="18" rx="1.5" fill="#fff"/><rect x="20" y="13" width="3" height="6" rx="1.5" fill="#fff"/></svg>
      <span class="brand-name">Mitschrift</span>
    </div>
    <label class="field"><span>Zugangspasswort</span><input type="password" id="pw" autocomplete="current-password" autofocus required></label>
    <button class="btn primary" type="submit">Anmelden</button>
    <div class="err" id="err" role="alert"></div>
    <p class="muted">Pilotbetrieb. Nur Testaufnahmen ohne echte personenbezogene Daten verwenden.</p>
  </form>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
      if (r.ok) { location.href = '/'; return; }
      let msg = 'Anmeldung fehlgeschlagen'; try { msg = (await r.json()).detail || msg; } catch {}
      document.getElementById('err').textContent = msg;
    });
  </script>
</body>
</html>
