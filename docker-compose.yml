# Eine Mitschrift-Instanz (Test oder Produktiv). Die gemeinsamen Dienste (HTTPS, Sprachmodell)
# laufen in deploy/platform und sind über das Netz "mitschrift" erreichbar.
#
#   docker compose -p mitschrift-test up -d --build      (INSTANCE=test in .env)
#   docker compose -p mitschrift-prod up -d --build      (INSTANCE=prod in .env)

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      MODELS_DIR: /models
      MITSCHRIFT_ENV_FILE: /nonexistent
    volumes:
      - ./data:/data
      - ${MODELS_HOST_DIR:-./models}:/models
    networks:
      mitschrift:
        aliases:
          - ${INSTANCE:-prod}-app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 120s

networks:
  mitschrift:
    external: true
    name: mitschrift
